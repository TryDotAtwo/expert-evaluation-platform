name: Cloudflare DNS Maintenance

on:
  workflow_dispatch:
    inputs:
      zone_name:
        description: Cloudflare zone name
        required: true
        default: xn--80a3aie.xn--p1ai
      record_name:
        description: DNS record name
        required: true
        default: xn--80a3aie.xn--p1ai
      record_type:
        description: DNS record type
        required: true
        type: choice
        options:
          - A
          - AAAA
        default: A
      record_content:
        description: DNS record content
        required: true
        default: 192.0.2.0

jobs:
  ensure-proxied-placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure proxied Cloudflare DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: ${{ inputs.zone_name }}
          RECORD_NAME: ${{ inputs.record_name }}
          RECORD_TYPE: ${{ inputs.record_type }}
          RECORD_CONTENT: ${{ inputs.record_content }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub secret is missing" >&2
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          json_header="Content-Type: application/json"

          zone_response="$(
            curl -fsS \
              -H "${auth_header}" \
              -H "${json_header}" \
              "${api}/zones?name=${ZONE_NAME}"
          )"
          zone_id="$(
            printf '%s' "${zone_response}" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const body = JSON.parse(s); const id = body.result?.[0]?.id; if (!id) process.exit(2); process.stdout.write(id); });'
          )"

          records_response="$(
            curl -fsS \
              -H "${auth_header}" \
              -H "${json_header}" \
              "${api}/zones/${zone_id}/dns_records?type=${RECORD_TYPE}&name=${RECORD_NAME}"
          )"
          record_ids="$(
            printf '%s' "${records_response}" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const body = JSON.parse(s); process.stdout.write((body.result || []).map((item) => item.id).join("\n")); });'
          )"

          payload="$(
            node -e 'process.stdout.write(JSON.stringify({ type: process.env.RECORD_TYPE, name: process.env.RECORD_NAME, content: process.env.RECORD_CONTENT, proxied: true, ttl: 1 }))'
          )"

          if [ -z "${record_ids}" ]; then
            curl -fsS \
              -X POST \
              -H "${auth_header}" \
              -H "${json_header}" \
              --data "${payload}" \
              "${api}/zones/${zone_id}/dns_records" >/dev/null
          else
            while IFS= read -r record_id; do
              [ -z "${record_id}" ] && continue
              curl -fsS \
                -X PATCH \
                -H "${auth_header}" \
                -H "${json_header}" \
                --data "${payload}" \
                "${api}/zones/${zone_id}/dns_records/${record_id}" >/dev/null
            done <<< "${record_ids}"
          fi

          echo "DNS_OK zone=${ZONE_NAME} record=${RECORD_TYPE} ${RECORD_NAME} proxied=true content=${RECORD_CONTENT}"
