name: Deploy Cloudflare Root Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-root-site.yml"
      - "infra/cloudflare/tupa-root-site/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/tupa-root-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/tupa-root-site/package-lock.json

      - run: npm ci

      - run: npm run check

      - name: Remove conflicting apex DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: xn--80a3aie.xn--p1ai
          RECORD_NAME: xn--80a3aie.xn--p1ai
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          json_header="Content-Type: application/json"

          zone_response="$(
            curl -fsS \
              -H "${auth_header}" \
              -H "${json_header}" \
              "${api}/zones?name=${ZONE_NAME}"
          )"
          zone_id="$(
            printf '%s' "${zone_response}" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const body = JSON.parse(s); const id = body.result?.[0]?.id; if (!id) process.exit(2); process.stdout.write(id); });'
          )"

          records_response="$(
            curl -fsS \
              -H "${auth_header}" \
              -H "${json_header}" \
              "${api}/zones/${zone_id}/dns_records?name=${RECORD_NAME}"
          )"
          delete_ids="$(
            printf '%s' "${records_response}" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => { const body = JSON.parse(s); const ids = (body.result || []).filter((item) => ["A", "AAAA", "CNAME"].includes(item.type)).map((item) => item.id); process.stdout.write(ids.join("\n")); });'
          )"

          if [ -z "${delete_ids}" ]; then
            echo "No conflicting apex A/AAAA/CNAME records"
            exit 0
          fi

          while IFS= read -r record_id; do
            [ -z "${record_id}" ] && continue
            curl -fsS \
              -X DELETE \
              -H "${auth_header}" \
              -H "${json_header}" \
              "${api}/zones/${zone_id}/dns_records/${record_id}" >/dev/null
            echo "Deleted conflicting DNS record ${record_id}"
          done <<< "${delete_ids}"

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
