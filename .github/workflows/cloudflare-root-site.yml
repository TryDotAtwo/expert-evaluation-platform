name: Deploy Cloudflare Root Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-root-site.yml"
      - "infra/cloudflare/tupa-root-site/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/tupa-root-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/tupa-root-site/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
