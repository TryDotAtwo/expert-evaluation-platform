<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Экспертная платформа</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/css/app.css?v=prod-d1-ux-9" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <button class="brand-mark" id="menu-toggle" type="button" aria-label="Свернуть меню" aria-expanded="true">Э</button>
          <div>
            <strong>Экспертная платформа</strong>
            <span>тупа.рф/expert</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-button hidden" id="profile-button" type="button" title="Профиль" aria-label="Профиль">
            <span>◎</span>
          </button>
          <button class="icon-button hidden" id="logout-button" type="button" title="Выйти" aria-label="Выйти">
            <span>↗</span>
          </button>
        </div>
      </header>

      <main class="auth-screen" id="auth-screen">
        <section class="auth-panel auth-workplace">
          <div class="auth-header">
            <h1>Рабочее место эксперта</h1>
            <div class="auth-tabs" id="auth-tabs">
              <button class="active" type="button" data-auth-mode="login">Вход</button>
              <button type="button" data-auth-mode="register">Регистрация</button>
            </div>
          </div>
          <form class="auth-form" id="password-login-form">
            <label>Email<input id="login-email" type="email" autocomplete="email" placeholder="name@example.com" required /></label>
            <label>Пароль<input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required /></label>
            <button class="primary-button" type="submit">Войти</button>
            <button class="google-button" id="google-login-button" type="button">Войти с Google</button>
            <button class="link-button" id="password-setup-open" type="button">Установить пароль</button>
          </form>
          <form class="auth-form hidden" id="password-setup-form">
            <div class="form-row">
              <label>Email<input id="setup-email" type="email" autocomplete="email" placeholder="name@example.com" required /></label>
              <label>Новый пароль<input id="setup-password" type="password" autocomplete="new-password" minlength="8" placeholder="минимум 8 символов" required /></label>
            </div>
            <div class="form-row">
              <label>Код<input id="setup-code" inputmode="numeric" maxlength="6" placeholder="000000" /></label>
              <button class="secondary-button" id="password-setup-request" type="button">Получить код</button>
            </div>
            <button class="primary-button" type="submit">Сохранить пароль и войти</button>
          </form>
          <form class="auth-form hidden" id="registration-form">
            <div class="form-row">
              <label>Email<input id="register-email" type="email" autocomplete="email" placeholder="name@example.com" required /></label>
              <label>Пароль<input id="register-password" type="password" autocomplete="new-password" minlength="8" placeholder="минимум 8 символов" required /></label>
            </div>
            <div class="form-row">
              <label>Никнейм<input id="register-display-name" autocomplete="nickname" placeholder="как показывать внутри платформы" required /></label>
              <label>Связь<input id="register-contact" placeholder="@telegram или другой контакт" required /></label>
            </div>
            <fieldset>
              <legend>Области права</legend>
              <div class="area-grid compact" id="registration-area-grid"></div>
            </fieldset>
            <div class="check-stack">
              <label class="toggle-line"><input id="register-coauthor-consent" type="checkbox" /> Хочу, чтобы упоминали в статьях как соавтора/эксперта</label>
              <label class="toggle-line"><input id="register-wants-reviewer" type="checkbox" /> Хочу быть ревьювером</label>
            </div>
            <button class="primary-button" type="submit">Отправить заявку</button>
          </form>
          <div class="form-note" id="auth-note"></div>
        </section>
      </main>

      <main class="workspace hidden" id="workspace">
        <aside class="queue-rail" id="queue-rail">
          <div class="rail-header">
            <div>
              <span class="eyebrow">Меню</span>
              <h2>Проекты и задания</h2>
            </div>
            <div class="rail-tools">
              <div class="status-pill" id="sync-status">готово</div>
              <button class="icon-button" id="refresh-button" type="button" title="Обновить" aria-label="Обновить">↻</button>
            </div>
          </div>
          <div class="mode-switch hidden" id="mode-switch">
            <button type="button" data-mode="expert" class="active">Эксперт</button>
            <button type="button" data-mode="reviewer">Ревью</button>
          </div>
          <section class="menu-section">
            <div class="menu-section-title">Проекты</div>
            <div class="project-menu-list" id="compact-project-list"></div>
          </section>
          <label class="search-box">Поиск задания<input id="assignment-search" placeholder="название, тип, статус" /></label>
          <section class="menu-section menu-section-grow">
            <div class="menu-section-title">Задания</div>
            <div class="assignment-list" id="assignment-list"></div>
          </section>
        </aside>

        <section class="workbench">
          <section class="task-card" id="task-card">
            <div class="empty-state">
              <h2>Выберите задание</h2>
              <p>Слева находится очередь. По центру появятся материалы, форма и история.</p>
            </div>
          </section>
          <section class="admin-surface hidden" id="admin-surface"></section>
        </section>

        <aside class="agent-rail">
          <section class="agent-panel">
            <div class="agent-head">
              <div>
                <span class="eyebrow">ИИ-агент</span>
                <h2>Чат с агентом</h2>
              </div>
              <div class="agent-live">online</div>
            </div>
            <div class="agent-log" id="agent-log"></div>
            <form class="agent-form" id="agent-form">
              <textarea id="agent-input" rows="3" placeholder="Сообщение агенту"></textarea>
              <button class="secondary-button" type="submit">Отправить</button>
            </form>
          </section>
        </aside>
      </main>
    </div>

    <div class="drawer-backdrop hidden" id="drawer-backdrop"></div>
    <aside class="profile-drawer hidden" id="profile-drawer" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <span class="eyebrow">Профиль</span>
          <h2>Профиль и доступы</h2>
        </div>
        <button class="icon-button" id="drawer-close" type="button" aria-label="Закрыть">×</button>
      </div>
      <form class="profile-form" id="profile-form">
        <label>Никнейм<input name="display_name" id="profile-display-name" placeholder="как показывать внутри платформы" /></label>
        <fieldset>
          <legend>Области права</legend>
          <div class="area-grid" id="legal-area-grid"></div>
        </fieldset>
        <label class="toggle-line"><input name="coauthor_consent" id="profile-coauthor-consent" type="checkbox" /> Хочу, чтобы упоминали в статьях как соавтора/эксперта</label>
        <label class="toggle-line"><input name="wants_reviewer" id="profile-wants-reviewer" type="checkbox" /> Хочу быть ревьювером</label>
        <button class="primary-button" type="submit">Сохранить профиль</button>
      </form>
    </aside>

    <div class="toast-stack" id="toast-stack"></div>
    <script type="module" src="/static/js/app.js?v=prod-d1-ux-9"></script>
  </body>
</html>
